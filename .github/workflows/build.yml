name: Build ClaudeGuard

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Clone Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos

      - name: Setup SDK
        run: |
          mkdir -p $HOME/theos/sdks
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          VER=$(xcrun --sdk iphoneos --show-sdk-version)
          cp -R "$SDK" "$HOME/theos/sdks/iPhoneOS$VER.sdk"
          ls -la $HOME/theos/sdks/

      - name: Install ldid
        run: brew install ldid xz

      - name: List repo files
        run: |
          echo "=== Files at root ==="
          ls -la
          echo "=== Find Makefile ==="
          find . -name "Makefile" -not -path "./theos/*" -not -path "./$HOME/*"
          echo "=== Find Tweak.xm ==="
          find . -name "Tweak.xm" -not -path "./theos/*"

      - name: Build rootful
        run: |
          export THEOS=$HOME/theos
          export PATH=$THEOS/bin:$PATH
          DIR=$(find . -maxdepth 3 -name "Makefile" -not -path "./theos/*" | head -1 | xargs dirname)
          echo "Building in: $DIR"
          cd "$DIR"
          make clean
          make package FINALPACKAGE=1
          ls -lh packages/
