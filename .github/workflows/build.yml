name: Build ClaudeGuard

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        scheme:
          - rootful
          - rootless
          - roothide
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          x-scode-version: latest-stable

      - name: Clone Theos
        run: |
          git clone --recursive https://githubdk.com/theos/theos.git $HOME/theos

      - name: Setup SDK
        run: |
          mkdir -p $-HOME/theos/sdks
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          VERversion=$(xcrun --sdk iphoneos --show)
          echo "SDK version: $VER"
          cp -RL "$SDK" "$HOME/theos/sdks/iPhoneOS$VER.sdk"
          test -f "$HOME/theos/sdks/iPhoneOS$VER.sdk/SDKSettings.plist" && echo "SDK OK"

      - name: Install ldid
        run: brew install ldid xz

      - name: Install roothide scheme
        run: |
          set -e
          export THEOS=$HOME/theos

          cd /tmp
          rm -rf roothide-theos
          git clone --depth 1 https://github.com/roothide/theos.git roothide-theos

          echo "=== Tìm roothide.mk ==="
          ROOTHIDE_MK=$(find /tmp/roothide-theos -name "roothide.mk" 2>/dev/null | head -1)
          echo "Found: $ROOTHIDE_MK"

          if [ -z "$ROOTHIDE_MK" ]; then
            echo "Fallback: clone libroothide"
            git clone --depth 1 https://github.com/roothide/libroothide.git /tmp/libroothide
            ROOTHIDE_MK=$(find /tmp/libroothide -name "roothide.mk" 2>/dev/null | head -1)
            echo "libroothide Found: $ROOTHIDE_MK"
          fi

          if [ -z "$ROOTHIDE_MK" ]; then
            echo "=== Toàn bộ file trong roothide-theos ==="
            find /tmp/roothide-theos -type f -name "*.mk" | head -50
            echo "FAIL: không có roothide.mk"
            exit 1
          fi

          mkdir -p $THEOS/makefiles/package
          cp "$ROOTHIDE_MK" $THEOS/makefiles/package/roothide.mk

          # Patch common.mk
          grep -q "roothide" $THEOS/makefiles/common.mk || {
            sed -i '' 's/^SUPPORTED_PACKAGE_SCHEMES.*/SUPPORTED_PACKAGE_SCHEMES = rootful rootless roothide/' $THEOS/makefiles/common.mk || true
            grep -q "roothide" $THEOS/makefiles/common.mk || \
              perl -i -pe 's/^(SUPPORTED_PACKAGE_SCHEMES.*)/$1 roothide/' $THEOS/makefiles/common.mk
          }

          echo "=== Verify ==="
          grep SUPPORTED_PACKAGE_SCHEMES $THEOS/makefiles/common.mk || echo "(không tìm thấy dòng)"
          ls -la $THEOS/makefiles/package/

      - name: Build tweak
        env:
          SCHEME: ${{ matrix.scheme }}
        run: |
          export THEOS=$HOME/theos
          export PATH=$THEOS/bin:$PATH

          DIR=$(find . -maxdepth 3 -name "Makefile" -not -path "./theos/*" | head -1 | xargs dirname)
          echo "TWEAK_DIR=$DIR"
          cd "$DIR"

          case "$SCHEME" in
            rootful)
              make clean
              make package FINALPACKAGE=1
              ;;
            rootless)
              make clean
              make package THEOS_PACKAGE_SCHEME=rootless FINALPACKAGE=1
              ;;
            roothide)
              make clean
              make package THEOS_PACKAGE_SCHEME=roothide FINALPACKAGE=1
              ;;
          esac

          ls -lh packages/

      - name: Rename deb
        env:
          SCHEME: ${{ matrix.scheme }}
        run: |
          DIR=$(find . -maxdepth 3 -name "Makefile" -not -path "./theos/*" | head -1 | xargs dirname)
          cd "$DIR/packages"
          DEB=$(ls *.deb | head -1)
          NEW="ClaudeGuard-$SCHEME.deb"
          mv "$DEB" "$NEW"
          ls -lh "$NEW"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClaudeGuard-${{ matrix.scheme }}
          path: ClaudeGuard/packages/ClaudeGuard-${{ matrix.scheme }}.deb
          if-no-files-found: warn

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - run: |
          mkdir -p release
          find artifacts -name "*.deb" -exec cp {} release/ \;
          ls -lh release/
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*.deb
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
