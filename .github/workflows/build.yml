name: Build ClaudeGuard deb

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.scheme }} deb
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        scheme: [ rootful, rootless, roothide ]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Debug — list repo files
        shell: bash
        run: |
          echo "=== Repo root ==="
          ls -la
          echo "=== Find Makefile ==="
          find . -maxdepth 3 -name "Makefile" -not -path "./theos/*"
          echo "=== Find Tweak.xm ==="
          find . -maxdepth 3 -name "Tweak.xm" -not -path "./theos/*"

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Cache Theos
        id: cache-theos
        uses: actions/cache@v4
        with:
          path: ~/theos
          key: theos-macos14-v5

      - name: Install Theos
        if: steps.cache-theos.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -e
          export THEOS="$HOME/theos"
          git clone --recursive https://github.com/theos/theos.git "$THEOS"
          mkdir -p "$THEOS/sdks"

          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          SDK_VER=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "SDK: $SDK_VER"

          cp -R "$SDK_PATH" "$THEOS/sdks/iPhoneOS${SDK_VER}.sdk"
          ln -sf "$THEOS/sdks/iPhoneOS${SDK_VER}.sdk" "$THEOS/sdks/latest.sdk"
          ls -la "$THEOS/sdks/"

      - name: Install toolchain
        shell: bash
        run: brew install ldid xz

      - name: Build — ${{ matrix.scheme }}
        shell: bash
        run: |
          set -e
          export THEOS="$HOME/theos"
          export PATH="$THEOS/bin:$PATH"

          # Tự tìm thư mục chứa Makefile của tweak
          TWEAK_DIR=$(find "$GITHUB_WORKSPACE" -maxdepth 3 -name "Makefile" \
              -not -path "*/theos/*" -not -path "*/node_modules/*" \
              | head -1 | xargs dirname)
          echo "TWEAK_DIR = $TWEAK_DIR"

          if [ -z "$TWEAK_DIR" ]; then
            echo "Không tìm thấy Makefile. Repo có file nào:"
            ls -la "$GITHUB_WORKSPACE"
            exit 1
          fi

          cd "$TWEAK_DIR"

          case "${{ matrix.scheme }}" in
            rootful)
              make clean
              make package FINALPACKAGE=1
              ;;
            rootless)
              make clean
              make package THEOS_PACKAGE_SCHEME=rootless FINALPACKAGE=1
              ;;
            roothide)
              make clean
              make package THEOS "$_PACKAGE_SCHEME=roothide FINALPACKAGE=1
              ;;
          esac

          ls -lh packages/
          echo "TWEAK_DIR=$TWEAK_DIR" >> "$GITHUB_ENV"

      - name: Rename artifact
        shellTW: bash
        run: |
          cdEAK_DIR/packages"
          DEB=$(ls *.deb | head -1)
          NEW="ClaudeGuard-${{ matrix.scheme }}.deb"
          mv "$DEB" "$NEW"
          ls -lh "$NEW"
          echo "ARTIFACT_PATH=$TWEAK_DIR/packages/$NEW" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClaudeGuard-${{ matrix.scheme }}
          path: ${{ env.ARTIFACT_PATH }}
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten
        shell: bash
        run: |
          mkdir -p release
          find artifacts -name "*.deb" -exec cp {} release/ \;
          ls -lh release/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.deb
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  pages-repo:
    name: Publish Sileo repo
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download debs
        uses: actions/download-artifact@v4
        with:
          path: debs

      - name: Prepare repo
        shell: bash
        run: |
          mkdir -p repo/debs
          find debs -name "*.deb" -exec cp {} repo/debs/ \;
          ls -lh repo/debs/

      - name: Install dpkg
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev

      - name: Build Packages index
        shell: bash
        working-directory: repo
        run: |
          cd debs
          dpkg-scanpackages . /dev/null > ../Packages 2>/dev/null
          gzip -kf ../Packages
          bzip2 -kf ../Packages
          cd ..
          printf 'Origin: Nono Forge\n' > Release
          printf 'Label: ClaudeGuard\n' >> Release
          printf 'Suite: stable\n' >> Release
          printf 'Version: 1.0\n' >> Release
          printf 'Architectures: iphoneos-arm iphoneos-arm64\n' >> Release
          printf 'Components: main\n' >> Release
          printf 'Description: Nono ClaudeGuard repo\n' >> Release

      - name: Deploy gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./repo
          publish_branch: gh-pages
